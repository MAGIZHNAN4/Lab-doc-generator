<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lab Record Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#FBFAF5;
    --ink:#20283A;
    --rule:#DAD4C2;
    --margin-red:#A8394A;
    --graphite:#5C6470;
    --pine:#2E6B58;
    --pine-dark:#204C3F;
    --sheet-w: 680px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 32px;
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    min-height:100vh;
  }
  .topbar{
    display:flex;align-items:baseline;gap:14px;
    padding:22px 32px 16px;
    border-bottom:2px solid var(--ink);
    background:var(--paper);
  }
  .topbar .mark{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600; font-size:13px;
    background:var(--ink); color:var(--paper);
    padding:3px 8px; letter-spacing:.02em;
  }
  .topbar h1{ font-size:21px; font-weight:600; margin:0; }
  .topbar .sub{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--graphite); }
  .topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .topbar-actions button{ padding:6px 9px; font-size:10.5px; }
  .save-status{ font:10.5px 'IBM Plex Mono',monospace; color:var(--graphite); min-width:54px; }
  .layout{
    display:grid;
    grid-template-columns: minmax(320px, 440px) 1fr;
    min-height:calc(100vh - 70px);
  }
  @media (max-width: 920px){ .layout{grid-template-columns:1fr;} }
  .panel-form{ border-right:2px solid var(--ink); padding:26px 30px 60px; position:relative; }
  .panel-preview{ padding:26px 30px 60px; display:flex; flex-direction:column; align-items:center; gap:18px; overflow-x:auto; }
  .progress{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--graphite); display:flex; justify-content:space-between; margin-bottom:8px; }
  .progress-track{ height:3px; background:var(--rule); margin-bottom:24px; position:relative; }
  .progress-fill{ position:absolute; left:0; top:0; height:100%; background:var(--pine); transition:width .25s ease; }
  .question-controls{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:-4px 0 20px; padding:9px 10px; border:1px solid var(--rule); background:#fff; }
  .question-controls span{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--graphite); }
  .question-controls b{ color:var(--ink); }
  .question-controls button{ padding:6px 9px; font-size:10.5px; }
  .field-label{ font-size:10.5px; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em; color:var(--margin-red); margin-bottom:6px; display:block; }
  .field-title{ font-size:22px; font-weight:600; margin:0 0 6px; }
  .field-help{ font-size:13.5px; color:var(--graphite); margin:0 0 18px; line-height:1.5; max-width:46ch; }
  input[type=text], input[type=date], input[type=number], textarea{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:14px;
    padding:11px 12px; border:1.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:2px;
  }
  textarea{resize:vertical; min-height:100px; line-height:1.5;}
  input:focus, textarea:focus{ outline:2px solid var(--pine); outline-offset:1px; }
  .date-picker-row{ display:flex; gap:8px; align-items:stretch; }
  .date-picker-row input[type=text]{ flex:1; }
  .date-picker-row button{ white-space:nowrap; }
  .native-date-picker{ position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  .nav-row{ display:flex; gap:10px; margin-top:22px; }
  button{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.02em;
    padding:10px 16px; border:1.5px solid var(--ink); background:#fff; color:var(--ink);
    cursor:pointer; border-radius:2px;
  }
  button.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  button.primary:hover{background:#000;}
  button.ghost{border-color:var(--rule); color:var(--graphite);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.pine{background:var(--pine); color:#fff; border-color:var(--pine);}
  button.pine:hover{background:var(--pine-dark);}
  .sample-link{
    position:absolute; top:26px; right:30px; font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--pine); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0;
  }
  .format-note{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--graphite); border-top:1px solid var(--rule); padding-top:12px; margin-top:18px; line-height:1.6; }
  .upload-row{ margin-top:12px; }
  .upload-row.drag-active{ outline:2px solid var(--pine); outline-offset:4px; border-radius:2px; }
  .upload-btn{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
    color:var(--pine); border:1.5px dashed var(--pine); padding:9px 14px; border-radius:2px; cursor:pointer; background:#F2F6EC;
  }
  .upload-hint{ font-size:11.5px; color:var(--graphite); margin:6px 0 0; font-family:'IBM Plex Mono',monospace; }
  .thumb-wrap{ margin-top:12px; border:1px solid var(--rule); border-radius:2px; overflow:hidden; background:#fff; }
  .thumb-wrap img{ display:block; max-width:100%; max-height:260px; margin:0 auto; }
  .thumb-meta{ display:flex; justify-content:space-between; align-items:center; padding:7px 10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--graphite); border-top:1px solid var(--rule); }
  .thumb-meta button{ padding:4px 8px; font-size:10.5px; }
  .thumb-size{ display:flex; align-items:center; gap:8px; padding:7px 10px; border-top:1px solid var(--rule); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--graphite); }
  .thumb-size select{ font:inherit; color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:2px; padding:4px 6px; }
  .thumb-tools{ display:flex; flex-wrap:wrap; gap:6px; padding:7px 10px; border-top:1px solid var(--rule); }
  .thumb-tools button{ padding:4px 7px; font-size:10.5px; }

  /* ---- Document preview: mirrors the exact .docx layout ---- */
  .sheet{
    width:var(--sheet-w); background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.15), 0 12px 30px rgba(0,0,0,.08);
    border:2px solid #111; padding:34px 40px; font-family:'Tinos', 'Times New Roman', serif; font-size:13.5px; line-height:1.5; color:#111;
  }
  .doc-table{ width:100%; border-collapse:collapse; margin-bottom:14px; }
  .doc-table td{ border:1px solid #111; padding:6px 10px; font-weight:700; vertical-align:middle; }
  .doc-table .topic-cell{ text-align:center; width:73%; }
  .doc-table .meta-cell{ width:27%; }
  .doc-aim{ margin-bottom:16px; }
  .doc-aim b{ font-weight:700; text-decoration:underline; }
  .doc-aim-content{ white-space:pre-wrap; margin-top:4px; }
  .doc-label{ font-weight:700; text-decoration:underline; margin:14px 0 4px; }
  .doc-body-text{ white-space:pre-wrap; margin-bottom:6px; }
  .doc-code{ white-space:pre-wrap; margin-bottom:6px; }
  .doc-output-img{ max-width:100%; max-height:560px; object-fit:contain; object-position:left top; display:block; margin:4px 0 8px; }
  .doc-output-empty{ color:#999; font-style:italic; font-size:12.5px; margin-bottom:8px; }
  .doc-result{ margin-top:20px; }
  .doc-result b{ font-weight:700; text-decoration:underline; }
  .sheet.is-editing [data-preview-field]{ outline:1px dashed var(--pine); outline-offset:2px; background:#F2F6EC; cursor:text; }
  .sheet.is-editing [data-preview-field]:focus{ outline:2px solid var(--pine); background:#fff; }
  .review-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .empty-hint{ color:var(--graphite); font-family:'IBM Plex Mono',monospace; font-size:12px; max-width:32ch; text-align:center; margin-top:80px; }
  .modal-backdrop{ position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:rgba(32,40,58,.42); }
  .modal{ width:min(560px,100%); max-height:calc(100vh - 40px); overflow:auto; padding:22px; border:2px solid var(--ink); background:var(--paper); box-shadow:0 18px 44px rgba(0,0,0,.3); }
  .modal h2{ margin:0 0 8px; font-size:20px; }
  .modal p{ color:var(--graphite); font-size:13px; line-height:1.45; }
  .question-manager-row{ display:flex; align-items:center; gap:6px; padding:9px 0; border-top:1px solid var(--rule); font:12px 'IBM Plex Mono',monospace; }
  .question-manager-row span{ flex:1; }
  .question-manager-row button{ padding:5px 8px; font-size:10.5px; }
  .modal-actions{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:18px; }
  .image-editor-preview{ display:block; max-width:100%; max-height:340px; margin:12px auto; border:1px solid var(--rule); }
  .crop-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .crop-grid label{ display:grid; gap:4px; font:11px 'IBM Plex Mono',monospace; color:var(--graphite); }
  .crop-grid input{ padding:7px; }
  @media print{
    body{ background:#fff; }
    body > *:not(#printRoot){ display:none !important; }
    #printRoot{ display:block !important; }
    #printRoot .sheet{ width:auto; min-height:0; box-shadow:none; margin:0; }
    #printRoot .doc-aim, #printRoot .doc-result, #printRoot .question-print-block{ break-inside:avoid; page-break-inside:avoid; }
    @page{ size:A4; margin:14mm; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="mark">LR</span>
  <div>
    <h1>Lab Record Generator</h1>
    <div class="sub">Word, picture, and print-to-PDF export · draft autosaves in this browser</div>
  </div>
  <div class="topbar-actions">
    <span class="save-status" id="saveStatus">Not saved</span>
    <button type="button" class="ghost" id="btnLoadDraft">Load draft</button>
    <button type="button" class="ghost" id="btnClearDraft">Clear saved</button>
  </div>
</div>

<div class="layout">
  <div class="panel-form" id="panelForm"></div>
  <div class="panel-preview" id="panelPreview"></div>
</div>

<script>
// ---------------- State ----------------
function blankQ(){ return {question:"", code:"", outputText:"", outputImages:[]}; }
const state = { regNo:"", date:"", exNo:"", topic:"", aim:"", numQs:2, questions:[], result:"" };
let step = 0;
let previewEditing = false;
const DRAFT_STORAGE_KEY = "lab-record-generator-enhanced-v1";
let autosaveTimer = null;
let previewEditSnapshot = null;
let previewUndoStack = [];

function imagesForQuestion(question){ return question.outputImages || (question.outputImage ? [question.outputImage] : []); }
function serialiseState(){
  return {
    ...state,
    step,
    questions: state.questions.map(question => ({
      question: question.question || "",
      code: question.code || "",
      outputText: question.outputText || "",
      outputImages: imagesForQuestion(question).map(image => ({
        dataUrl:image.dataUrl, ext:image.ext, mime:image.mime, width:image.width, height:image.height,
        name:image.name, sizePercent:image.sizePercent ?? null, rotation:image.rotation || 0
      }))
    }))
  };
}
function setSaveStatus(text){
  const status = document.getElementById('saveStatus');
  if(status) status.textContent = text;
}
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  setSaveStatus('Saving…');
  autosaveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(serialiseState()));
      setSaveStatus('Saved locally');
    } catch(error){
      setSaveStatus('Draft too large');
    }
  }, 450);
}
function loadSavedDraft(){
  const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
  if(!raw){ alert('No saved draft was found in this browser.'); return; }
  try{
    const saved = JSON.parse(raw);
    state.regNo = saved.regNo || "";
    state.date = saved.date || "";
    state.exNo = saved.exNo || "";
    state.topic = saved.topic || "";
    state.aim = saved.aim || "";
    state.numQs = Math.max(1, Math.min(20, parseInt(saved.numQs) || 1));
    state.questions = Array.isArray(saved.questions) ? saved.questions.slice(0, state.numQs).map(question => ({
      question:question.question || "", code:question.code || "", outputText:question.outputText || "",
      outputImages:(question.outputImages || []).map(image => ({...image, arrayBuffer:null, rotation:image.rotation || 0}))
    })) : [];
    state.result = saved.result || "";
    step = Math.min(Math.max(0, parseInt(saved.step) || 0), buildSteps().length);
    previewEditing = false;
    render();
    setSaveStatus('Saved draft loaded');
  } catch(error){
    setSaveStatus('Could not load draft');
    alert('The saved draft could not be read. You can clear it and start a new record.');
  }
}
function clearSavedDraft(){
  if(!localStorage.getItem(DRAFT_STORAGE_KEY)) return;
  if(!confirm('Clear the locally saved draft? This will not change the record currently open.')) return;
  localStorage.removeItem(DRAFT_STORAGE_KEY);
  setSaveStatus('Saved draft cleared');
}

function buildSteps(){
  const s = [
    {key:"regNo", kind:"text", title:"Register Number", label:"Header — Reg No",
     help:"Placed in the left header cell, bold. E.g. 21CS1042."},
    {key:"exNo", kind:"text", title:"Exercise Number", label:"Header — Ex. No",
     help:"Printed as \u201cEx. No: __\u201d beneath the register number."},
    {key:"date", kind:"date", title:"Date", label:"Header — Date",
     help:"Use DD-MM-YYYY. Printed beneath the exercise number."},
    {key:"topic", kind:"text", title:"Topic", label:"Header — Topic",
     help:"Centered, bold, in the wide right-hand cell spanning all three header rows."},
    {key:"aim", kind:"textarea", title:"Aim", label:"Body — Aim",
     help:"One or two sentences. Printed as \u201cAIM: \u2026\u201d below the header table."},
    {key:"numQs", kind:"number", title:"Number of Questions", label:"Questions — Count",
     help:"Each question renders as QUESTION: / PROGRAM: / OUTPUT: in sequence, flowing continuously (no forced page breaks \u2014 matches how Word paginates it)."},
  ];
  const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
  for(let i=0;i<n;i++){
    s.push({key:"q"+i+"_question", kind:"textarea", title:"Q"+(i+1)+" — Question", label:"Question "+(i+1),
      help:"Printed under the bold, underlined \u201cQUESTION:\u201d label."});
    s.push({key:"q"+i+"_code", kind:"code", title:"Q"+(i+1)+" — Program", label:"Question "+(i+1)+" — Code",
      help:"Printed under the bold, underlined \u201cPROGRAM:\u201d label, preserving your line breaks and indentation."});
    s.push({key:"q"+i+"_output", kind:"output", title:"Q"+(i+1)+" — Output", label:"Question "+(i+1)+" — Output",
      help:"Printed under the bold, underlined \u201cOUTPUT:\u201d label, as an embedded picture \u2014 attach a screenshot of the program's output."});
  }
  s.push({key:"result", kind:"textarea", title:"Result", label:"Closing — Result",
    help:"Printed as \u201cRESULT: \u2026\u201d at the end of the record."});
  return s;
}
let steps = buildSteps();

function questionControlsHtml(){
  const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
  return `<div class="question-controls"><span>Questions: <b>${n}</b></span><div><button type="button" id="btnManageQuestions">Manage</button> <button type="button" id="btnRemoveQuestion" ${n <= 1 ? 'disabled' : ''}>− Remove last</button> <button type="button" id="btnAddQuestion" ${n >= 20 ? 'disabled' : ''}>+ Add question</button></div></div>`;
}
function bindQuestionControls(){
  const addButton = document.getElementById('btnAddQuestion');
  if(addButton) addButton.addEventListener('click', ()=>{
    const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
    if(n >= 20) return;
    state.numQs = n + 1;
    if(!state.questions[n]) state.questions[n] = blankQ();
    steps = buildSteps();
    scheduleAutosave();
    render();
  });
  const removeButton = document.getElementById('btnRemoveQuestion');
  if(removeButton) removeButton.addEventListener('click', ()=>{
    const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
    if(n <= 1) return;
    const wasReviewing = step >= steps.length;
    state.questions.splice(n - 1, 1);
    state.numQs = n - 1;
    steps = buildSteps();
    step = wasReviewing ? steps.length : Math.min(step, steps.length - 1);
    scheduleAutosave();
    render();
  });
  const manageButton = document.getElementById('btnManageQuestions');
  if(manageButton) manageButton.addEventListener('click', openQuestionManager);
}

function closeModal(){ document.getElementById('appModal')?.remove(); }
function showModal(content){
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'appModal';
  backdrop.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${content}</div>`;
  backdrop.addEventListener('click', event => { if(event.target === backdrop) closeModal(); });
  document.body.appendChild(backdrop);
  return backdrop;
}
function openQuestionManager(){
  const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
  const rows = Array.from({length:n}, (_, index) => `<div class="question-manager-row"><span>Question ${index + 1}</span><button type="button" data-move-question="${index}" data-direction="up" ${index === 0 ? 'disabled' : ''}>↑</button><button type="button" data-move-question="${index}" data-direction="down" ${index === n - 1 ? 'disabled' : ''}>↓</button><button type="button" data-delete-question="${index}" ${n === 1 ? 'disabled' : ''}>Delete</button></div>`).join('');
  const modal = showModal(`<h2>Manage questions</h2><p>Reorder questions with the arrows or delete any question. Deleting a question also deletes its program and screenshots.</p>${rows}<div class="modal-actions"><button type="button" class="ghost" id="btnModalClose">Done</button></div>`);
  modal.querySelector('#btnModalClose').addEventListener('click', ()=>{ closeModal(); render(); });
  modal.querySelectorAll('[data-move-question]').forEach(button => button.addEventListener('click', ()=>{
    const from = parseInt(button.dataset.moveQuestion);
    const to = button.dataset.direction === 'up' ? from - 1 : from + 1;
    [state.questions[from], state.questions[to]] = [state.questions[to] || blankQ(), state.questions[from] || blankQ()];
    scheduleAutosave();
    openQuestionManager();
  }));
  modal.querySelectorAll('[data-delete-question]').forEach(button => button.addEventListener('click', ()=>{
    const index = parseInt(button.dataset.deleteQuestion);
    if(!confirm(`Delete Question ${index + 1} and all of its content?`)) return;
    state.questions.splice(index, 1);
    state.numQs = n - 1;
    steps = buildSteps();
    step = Math.min(step, steps.length - 1);
    scheduleAutosave();
    openQuestionManager();
  }));
}

function getVal(key){
  if(key.startsWith("q")){
    const [qi, field] = key.split("_");
    const idx = parseInt(qi.slice(1));
    return (state.questions[idx] && state.questions[idx][field]) ?? "";
  }
  return state[key] ?? "";
}
function setVal(key, value){
  if(key.startsWith("q")){
    const [qi, field] = key.split("_");
    const idx = parseInt(qi.slice(1));
    if(!state.questions[idx]) state.questions[idx] = blankQ();
    state.questions[idx][field] = value;
  } else { state[key] = value; }
  scheduleAutosave();
}

async function loadSample(){
  state.regNo = "21CS1042";
  state.exNo = "4";
  const today = new Date();
  state.date = String(today.getDate()).padStart(2, "0") + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + today.getFullYear();
  state.topic = "Singly Linked List Implementation";
  state.aim = "To write a program that implements insertion, deletion and traversal on a singly linked list.";
  state.numQs = 1;
  state.questions = [{
    question:"Write a menu-driven C program to insert a node at the end of a singly linked list, delete the first node, and display the list.",
    code:"struct Node {\n  int data;\n  Node* next;\n};\n\nvoid insertEnd(Node*& head, int val) {\n  Node* n = new Node{val, nullptr};\n  if (!head) { head = n; return; }\n  Node* t = head;\n  while (t->next) t = t->next;\n  t->next = n;\n}",
    outputText:"", outputImages:[]
  }];
  state.result = "The program to implement a singly linked list was executed successfully and the output was verified.";
  steps = buildSteps();
  step = steps.length;
  render();
}

function render(){
  steps = buildSteps();
  step = Math.min(step, steps.length);
  renderForm();
  renderPreview();
}

function renderForm(){
  const el = document.getElementById('panelForm');
  const total = steps.length + 1;
  const current = Math.min(step, steps.length) + 1;
  const pct = Math.round((current/total)*100);
  const questionControls = questionControlsHtml();

  if(step >= steps.length){
    el.innerHTML = `
      <button class="sample-link" onclick="loadSample()">Load sample</button>
      <div class="progress"><span>Review</span><span>${pct}% completed</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${questionControls}
      <p class="field-label">Review All</p>
      <h2 class="field-title">Ready to export</h2>
      <p class="field-help">The preview matches the reference document exactly: bordered header table, QUESTION / PROGRAM / OUTPUT per question, RESULT at the close, page border repeating on every page.</p>
      <div class="nav-row"><button class="ghost" onclick="step=steps.length-1; render()">Back to edit</button></div>
      <div class="format-note">Format: header table (Reg No / Ex No / Date left, Topic merged right) &middot; AIM &middot; QUESTION: / PROGRAM: / OUTPUT: (picture) per question &middot; RESULT: at the close &middot; page border on every page</div>
    `;
    bindQuestionControls();
    return;
  }

  const s = steps[step];
  let inputHtml = "";
  if(s.kind === "textarea"){
    inputHtml = `<textarea id="fld" rows="5" autofocus>${escapeHtml(getVal(s.key))}</textarea>`;
  } else if(s.kind === "code"){
    inputHtml = `<textarea id="fld" rows="8" style="font-family:'IBM Plex Mono',monospace;" autofocus>${escapeHtml(getVal(s.key))}</textarea>`;
  } else if(s.kind === "number"){
    inputHtml = `<input id="fld" type="number" min="1" max="20" value="${escapeHtml(String(getVal(s.key)||1))}" />`;
  } else if(s.kind === "date"){

  el.innerHTML = `

    ${questionControls}

  bindQuestionControls();

  if(s.kind === "output"){
    const [qi] = s.key.split("_");
    const idx = parseInt(qi.slice(1));
    document.getElementById('imgFld').addEventListener('change', async (e)=>{
      const file = e.target.files && e.target.files[0];

    el.querySelectorAll('[data-remove-img]').forEach(btn => btn.addEventListener('click', ()=>{

    el.querySelectorAll('[data-image-size]').forEach(select => select.addEventListener('change', ()=>{

async function attachImages(idx, files){
  if(!state.questions[idx]) state.questions[idx] = blankQ();
  const q = state.questions[idx];
  if(!q.outputImages) q.outputImages = q.outputImage ? [q.outputImage] : [];
  for(const file of Array.from(files)){
    if(!['image/png', 'image/jpeg'].includes(file.type)){
      alert(`${file.name} was skipped. Please use a PNG or JPG image.`);
      continue;
    }
    if(file.size > 8 * 1024 * 1024){
      alert(`${file.name} was skipped because it is larger than 8 MB.`);
      continue;
    }
    const arrayBuffer = await file.arrayBuffer();
    const dataUrl = await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file);
    });
    const dims = await new Promise((res,rej)=>{
      const img = new Image();
      img.onload = ()=>res({width:img.naturalWidth, height:img.naturalHeight});
      img.onerror = rej; img.src = dataUrl;
    });
    const ext = file.type === 'image/png' ? 'png' : 'jpeg';
    q.outputImages.push({ arrayBuffer, dataUrl, ext, mime:file.type, width:dims.width, height:dims.height, name:file.name, sizePercent:null });
  }
  delete q.outputImage;
  scheduleAutosave();
  render();
}

async function openImageEditor(questionIndex, imageIndex){
  const question = state.questions[questionIndex];
  const image = imagesForQuestion(question)[imageIndex];
  if(!image) return;
  const modal = showModal(`<h2>Edit screenshot</h2><p>Crop unwanted edges by percentage and optionally rotate the image. Applying the edit replaces this screenshot in the record.</p><img class="image-editor-preview" src="${image.dataUrl}" alt="Screenshot to edit" /><div class="crop-grid"><label>Left crop (%)<input id="cropLeft" type="number" min="0" max="45" value="0" /></label><label>Right crop (%)<input id="cropRight" type="number" min="0" max="45" value="0" /></label><label>Top crop (%)<input id="cropTop" type="number" min="0" max="45" value="0" /></label><label>Bottom crop (%)<input id="cropBottom" type="number" min="0" max="45" value="0" /></label><label>Rotate<select id="rotateImage"><option value="0">No rotation</option><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">90° counter-clockwise</option></select></label></div><div class="modal-actions"><button type="button" class="ghost" id="btnCancelImageEdit">Cancel</button><button type="button" class="pine" id="btnApplyImageEdit">Apply edit</button></div>`);
  modal.querySelector('#btnCancelImageEdit').addEventListener('click', closeModal);
  modal.querySelector('#btnApplyImageEdit').addEventListener('click', async ()=>{
    const crop = {
      left:Math.max(0, Math.min(45, parseFloat(modal.querySelector('#cropLeft').value) || 0)),
      right:Math.max(0, Math.min(45, parseFloat(modal.querySelector('#cropRight').value) || 0)),
      top:Math.max(0, Math.min(45, parseFloat(modal.querySelector('#cropTop').value) || 0)),
      bottom:Math.max(0, Math.min(45, parseFloat(modal.querySelector('#cropBottom').value) || 0))
    };
    if(crop.left + crop.right >= 90 || crop.top + crop.bottom >= 90){ alert('Keep the total crop on each axis below 90%.'); return; }
    const applyButton = modal.querySelector('#btnApplyImageEdit');
    applyButton.disabled = true; applyButton.textContent = 'Applying…';
    try{
      await transformImage(image, crop, parseInt(modal.querySelector('#rotateImage').value));
      scheduleAutosave();
      closeModal();
      render();
    } catch(error){
      applyButton.disabled = false; applyButton.textContent = 'Apply edit';
      alert('This screenshot could not be edited. Please try another image.');
    }
  });
}
async function transformImage(image, crop, rotation){
  const source = await new Promise((resolve, reject) => {
    const img = new Image(); img.onload = ()=>resolve(img); img.onerror = reject; img.src = image.dataUrl;
  });
  const sx = Math.round(source.naturalWidth * crop.left / 100);
  const sy = Math.round(source.naturalHeight * crop.top / 100);
  const sw = Math.max(1, Math.round(source.naturalWidth * (100 - crop.left - crop.right) / 100));
  const sh = Math.max(1, Math.round(source.naturalHeight * (100 - crop.top - crop.bottom) / 100));
  const turns = ((rotation % 360) + 360) % 360;
  const canvas = document.createElement('canvas');
  canvas.width = turns === 90 || turns === 270 ? sh : sw;
  canvas.height = turns === 90 || turns === 270 ? sw : sh;
  const context = canvas.getContext('2d');
  context.translate(canvas.width / 2, canvas.height / 2);
  context.rotate(turns * Math.PI / 180);
  context.drawImage(source, sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if(!blob) throw new Error('Image conversion failed');
  image.dataUrl = canvas.toDataURL('image/png');
  image.arrayBuffer = await blob.arrayBuffer();
  image.ext = 'png'; image.mime = 'image/png'; image.width = canvas.width; image.height = canvas.height;
  image.name = image.name.replace(/\.[^.]+$/, '') + '-edited.png';
}

function formatDateInput(value){
  const isoMatch = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(isoMatch) return `${isoMatch[3]}-${isoMatch[2]}-${isoMatch[1]}`;
  const digits = String(value).replace(/\D/g, '').slice(0, 8);
  return [digits.slice(0,2), digits.slice(2,4), digits.slice(4,8)].filter(Boolean).join('-');
}

function dateToPickerValue(value){
  const match = String(value).match(/^(\d{2})-(\d{2})-(\d{4})$/);
  return match ? `${match[3]}-${match[2]}-${match[1]}` : "";
}

function isValidDate(value){
  const match = String(value).match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(!match) return false;
  const [, day, month, year] = match.map(Number);
  const date = new Date(year, month - 1, day);
  return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
}
function validateRecord(){
  const errors = [];
  if(!state.regNo.trim()) errors.push('Enter the Register Number.');
  if(!state.exNo.trim()) errors.push('Enter the Exercise Number.');
  if(!isValidDate(state.date)) errors.push('Enter a valid Date in DD-MM-YYYY format.');
  if(!state.topic.trim()) errors.push('Enter the Topic.');
  if(!state.aim.trim()) errors.push('Enter the Aim.');
  const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
  for(let i=0; i<n; i++){
    const question = state.questions[i] || blankQ();
    if(!question.question.trim()) errors.push(`Enter the text for Question ${i + 1}.`);
    if(!question.code.trim()) errors.push(`Enter the program for Question ${i + 1}.`);
    const images = imagesForQuestion(question);
    if(!images.length) errors.push(`Attach at least one output screenshot for Question ${i + 1}.`);
    images.forEach((image, imageIndex) => {
      if(!image.dataUrl || !/^data:image\/(png|jpeg);/i.test(image.dataUrl)) errors.push(`Question ${i + 1}, screenshot ${imageIndex + 1} is not a valid PNG/JPG image.`);
    });
  }
  if(!state.result.trim()) errors.push('Enter the Result.');
  return errors;
}
function validateBeforeExport(){
  const errors = validateRecord();
  if(!errors.length) return true;
  showModal(`<h2>Complete the record before exporting</h2><p>Please fix the following:</p><ul>${errors.map(error => `<li>${escapeHtml(error)}</li>`).join('')}</ul><div class="modal-actions"><button type="button" class="primary" id="btnCloseValidation">Back to edit</button></div>`).querySelector('#btnCloseValidation').addEventListener('click', closeModal);
  return false;
}
async function hydrateImagesForExport(){
  for(const question of state.questions){
    for(const image of imagesForQuestion(question)){
      if(!image.arrayBuffer && image.dataUrl){
        const response = await fetch(image.dataUrl);
        image.arrayBuffer = await response.arrayBuffer();
      }
    }
  }
}

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }
function previewAttrs(key){ return previewEditing ? `contenteditable="true" data-preview-field="${key}" spellcheck="true"` : ''; }
function previewText(value, emptyText='&nbsp;'){
  const text = String(value ?? '');
  return text ? nl2br(text) : (previewEditing ? '&nbsp;' : emptyText);
}
function capturePreviewText(){
  return {
    regNo:state.regNo, date:state.date, exNo:state.exNo, topic:state.topic, aim:state.aim, result:state.result,
    questions:state.questions.map(question => ({question:question.question || '', code:question.code || ''}))
  };
}
function restorePreviewText(snapshot){
  if(!snapshot) return;
  ['regNo','date','exNo','topic','aim','result'].forEach(key => state[key] = snapshot[key] || '');
  snapshot.questions.forEach((question, index) => {
    if(!state.questions[index]) state.questions[index] = blankQ();
    state.questions[index].question = question.question || '';
    state.questions[index].code = question.code || '';
  });
  scheduleAutosave();
}

  }

  el.innerHTML = `

      ${showExport ? `
      <button class="primary" id="btnDocx">Download Word (.docx)</button>
      <button class="pine" id="btnImages">Download Pictures (.png, one per page)</button>
      <button class="ghost" id="btnPdf">Print / Save PDF</button>` : ``}
    </div>
    <div class="sheet ${previewEditing ? 'is-editing' : ''}" id="sheet">
      <table class="doc-table" data-page-block>
        <tr>
          <td class="meta-cell"><span ${previewAttrs("regNo")}>${previewText(state.regNo, '\u2014')}</span></td>
          <td class="topic-cell" rowspan="3" style="text-align:center;"><span ${previewAttrs("topic")}>${previewText(state.topic, '\u2014')}</span></td>
        </tr>
        <tr><td class="meta-cell">Ex. No: <span ${previewAttrs("exNo")}>${previewText(state.exNo, '\u2014')}</span></td></tr>
        <tr><td class="meta-cell"><span ${previewAttrs("date")}>${previewText(state.date, '\u2014')}</span></td></tr>
      </table>
      <div class="doc-aim" data-page-block><b>AIM:</b><div class="doc-aim-content" ${previewAttrs("aim")}>${previewText(state.aim)}</div></div>
      ${qHtml}
      <div class="doc-result" data-page-block><b>RESULT</b>: <span ${previewAttrs("result")}>${previewText(state.result)}</span></div>
    </div>
  `;

  document.getElementById('btnEditPreview')?.addEventListener('click', ()=>{
    previewEditSnapshot = capturePreviewText();
    previewUndoStack = [];
    previewEditing = true;
    render();
  });
  document.getElementById('btnSavePreview')?.addEventListener('click', ()=>{
    previewEditing = false;
    previewEditSnapshot = null;
    previewUndoStack = [];
    scheduleAutosave();
    render();
  });
  document.getElementById('btnCancelPreview')?.addEventListener('click', ()=>{
    restorePreviewText(previewEditSnapshot);
    previewEditing = false;
    previewEditSnapshot = null;
    previewUndoStack = [];
    render();
  });
  document.getElementById('btnUndoPreview')?.addEventListener('click', ()=>{
    restorePreviewText(previewUndoStack.pop());
    render();
  });
  if(previewEditing){
    el.querySelectorAll('[data-preview-field]').forEach(field => field.addEventListener('input', ()=>{
      previewUndoStack.push(capturePreviewText());
      if(previewUndoStack.length > 60) previewUndoStack.shift();
      setVal(field.dataset.previewField, field.innerText.replace(/\r/g, ''));
    }));
  }

  if(showExport){
    document.getElementById('btnDocx').addEventListener('click', generateDocx);
    document.getElementById('btnImages').addEventListener('click', exportImages);
    document.getElementById('btnPdf').addEventListener('click', exportPdf);
  }
}

// ---------------- DOCX export: raw OOXML matching the reference document ----------------
function xmlEscape(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
const RPR_BODY = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="26"/><w:szCs w:val="26"/>';
const RPR_BOLD = RPR_BODY + '<w:b/><w:bCs/>';
const RPR_LABEL = RPR_BOLD + '<w:u w:val="single"/>';
const RPR_CODE = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/>';

function runsML(text, rPr){
  const lines = String(text ?? "").split("\n");
  return lines.map((line,i)=>{
    const r = `<w:r><w:rPr>${rPr}</w:rPr><w:t xml:space="preserve">${xmlEscape(line)}</w:t></w:r>`;
    return i < lines.length-1 ? r + '<w:r><w:br/></w:r>' : r;
  }).join("");
}
function para(runsXml, opts={}){
  const pPr = `<w:pPr><w:spacing w:after="0"/>${opts.align?`<w:jc w:val="${opts.align}"/>`:''}</w:pPr>`;
  return `<w:p>${pPr}${runsXml}</w:p>`;
}
function labelPara(text){ return para(`<w:r><w:rPr>${RPR_LABEL}</w:rPr><w:t>${xmlEscape(text)}</w:t></w:r>`); }
function bodyPara(text){ return para(runsML(text, RPR_BODY)); }
function codePara(text){
  return String(text ?? "").split("\n").map(line => para(`<w:r><w:rPr>${RPR_CODE}</w:rPr><w:t xml:space="preserve">${xmlEscape(line)}</w:t></w:r>`)).join("");
}

const CONTENT_WIDTH_EMU = 9026 * 635;
const MAX_IMAGE_HEIGHT_EMU = 8200 * 635;
function computeImageExtent(img){
  const nativeW = img.width * 9525, nativeH = img.height * 9525;
  const fitRatio = Math.min(CONTENT_WIDTH_EMU / nativeW, MAX_IMAGE_HEIGHT_EMU / nativeH);
  const requestedPercent = parseInt(img.sizePercent);
  // Auto preserves the native size; a chosen percentage is relative to page width.
  // Either mode is capped to the usable page area and preserves the aspect ratio.
  const requestedRatio = [25, 50, 75, 100].includes(requestedPercent)
    ? (CONTENT_WIDTH_EMU * requestedPercent / 100) / nativeW
    : 1;
  const ratio = Math.min(requestedRatio, fitRatio);
  return {cx: Math.round(nativeW * ratio), cy: Math.round(nativeH * ratio)};
}
function imageDrawingRun(rId, cx, cy, name, id){
  return `<w:r><w:rPr>${RPR_BODY}</w:rPr><w:drawing>
    <wp:inline distT="0" distB="0" distL="0" distR="0">
      <wp:extent cx="${cx}" cy="${cy}"/>
      <wp:effectExtent l="0" t="0" r="0" b="0"/>
      <wp:docPr id="${id}" name="${xmlEscape(name)}"/>
      <wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>
      <a:graphic>
        <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
          <pic:pic>
            <pic:nvPicPr><pic:cNvPr id="${id}" name="${xmlEscape(name)}"/><pic:cNvPicPr/></pic:nvPicPr>
            <pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
            <pic:spPr>
              <a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>
              <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
            </pic:spPr>
          </pic:pic>
        </a:graphicData>
      </a:graphic>
    </wp:inline>
  </w:drawing></w:r>`;
}

function buildHeaderTableXml(){
  const half = 2538, wide = 7038;
  const borders = `<w:tcBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/></w:tcBorders>`;
  const cell = (widthTw, content, vMerge, center) => `<w:tc><w:tcPr><w:tcW w:w="${widthTw}" w:type="dxa"/>${borders}${vMerge?`<w:vMerge w:val="${vMerge}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>${content}</w:tc>`;
  const p = (text, center) => `<w:p><w:pPr><w:spacing w:after="0"/>${center?'<w:jc w:val="center"/>':''}</w:pPr>${text?`<w:r><w:rPr>${RPR_BOLD}</w:rPr><w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r>`:''}</w:p>`;

  return `<w:tbl>
    <w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblLook w:val="04A0" w:firstRow="1" w:firstColumn="1" w:noHBand="0" w:noVBand="1"/></w:tblPr>
    <w:tblGrid><w:gridCol w:w="${half}"/><w:gridCol w:w="${wide}"/></w:tblGrid>
    <w:tr>${cell(half, p("Reg No: " + (state.regNo||"")))}${cell(wide, p((state.topic||"").toUpperCase(), true), "restart")}</w:tr>
    <w:tr>${cell(half, p("Ex. No: " + (state.exNo||"")))}${cell(wide, p(""), "continue")}</w:tr>
    <w:tr>${cell(half, p(state.date||""))}${cell(wide, p(""), "continue")}</w:tr>
  </w:tbl>
  <w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`;
}

function buildDocumentXml(imageRels){
  const n = Math.max(1, Math.min(20, parseInt(state.numQs)||1));
  let body = buildHeaderTableXml();
  body += labelPara("AIM:");
  body += bodyPara(state.aim||"");
  body += `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`;

  let docPrId = 100;
  for(let i=0;i<n;i++){
    const q = state.questions[i] || blankQ();
    body += labelPara("QUESTION:");
    body += bodyPara(q.question||"");
    body += labelPara("PROGRAM:");
    body += codePara(q.code||"");
    body += labelPara("OUTPUT:");
    const images = q.outputImages || (q.outputImage ? [q.outputImage] : []);
    if(images.length){
      images.forEach((image, imageIndex) => {
        const rId = "rIdImg" + (imageRels.length+1);
        imageRels.push({rId, ext: image.ext, arrayBuffer: image.arrayBuffer, mime: image.mime});
        const {cx, cy} = computeImageExtent(image);
        docPrId++;
        body += `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr>${imageDrawingRun(rId, cx, cy, "Output "+(i+1)+" - "+(imageIndex+1), docPrId)}</w:p>`;
      });
    } else if(q.outputText){
      body += bodyPara(q.outputText);
    }
    body += `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`;
  }

  body += para(`<w:r><w:rPr>${RPR_LABEL}</w:rPr><w:t>RESULT</w:t></w:r><w:r><w:rPr>${RPR_BODY}</w:rPr><w:t xml:space="preserve">: </w:t></w:r>${runsML(state.result||"", RPR_BODY)}`);

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
  <w:body>
    ${body}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838" w:orient="portrait"/>
      <w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>
      <w:pgBorders w:zOrder="front" w:display="allPages" w:offsetFrom="page">
        <w:top w:val="single" w:sz="4" w:space="24" w:color="auto"/>
        <w:left w:val="single" w:sz="4" w:space="24" w:color="auto"/>
        <w:bottom w:val="single" w:sz="4" w:space="24" w:color="auto"/>
        <w:right w:val="single" w:sz="4" w:space="24" w:color="auto"/>
      </w:pgBorders>
      <w:cols w:space="708"/>
      <w:docGrid w:linePitch="360"/>
    </w:sectPr>
  </w:body>
</w:document>`;
}

const STYLES_XML = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="26"/></w:rPr></w:rPrDefault></w:docDefaults>
  <w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
</w:styles>`;

async function generateDocx(){
  const zip = new JSZip();
  const imageRels = [];
  const documentXml = buildDocumentXml(imageRels);

  const contentTypeExts = [...new Set(imageRels.map(r=>r.ext))];
  const ctOverrides = contentTypeExts.map(ext => `<Default Extension="${ext}" ContentType="image/${ext==='jpeg'?'jpeg':'png'}"/>`).join("");
  const CONTENT_TYPES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  ${ctOverrides}
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const RELS_ROOT = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  let docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;
  imageRels.forEach((r, idx) => {
    const fname = `image${idx+1}.${r.ext}`;
    docRels += `\n  <Relationship Id="${r.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${fname}"/>`;
    zip.file(`word/media/${fname}`, r.arrayBuffer);
  });
  docRels += `\n</Relationships>`;

  zip.file("[Content_Types].xml", CONTENT_TYPES);
  zip.file("_rels/.rels", RELS_ROOT);
  zip.file("word/document.xml", documentXml);
  zip.file("word/styles.xml", STYLES_XML);
  zip.file("word/_rels/document.xml.rels", docRels);

  const blob = await zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  downloadBlob(blob, (state.topic || "lab-record").replace(/\s+/g,"_") + ".docx");
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------------- Image export: slice the continuous sheet into A4 pages, zipped ----------------
async function exportImages(){
  const btn = document.getElementById('btnImages');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Rendering\u2026";
  try{
    const sheet = document.getElementById('sheet');
    const fullCanvas = await html2canvas(sheet, {scale:3, backgroundColor:"#ffffff"});
    const pageAspect = 11906/16838; // A4 width/height
    const pageHeightPx = Math.round(fullCanvas.width / pageAspect);
    const pageCount = Math.max(1, Math.ceil(fullCanvas.height / pageHeightPx));
    const zip = new JSZip();
    for(let p=0; p<pageCount; p++){
      const c = document.createElement('canvas');
      c.width = fullCanvas.width; c.height = pageHeightPx;
      const ctx = c.getContext('2d');
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(fullCanvas, 0, p*pageHeightPx, fullCanvas.width, pageHeightPx, 0, 0, fullCanvas.width, pageHeightPx);
      const blob = await new Promise(res => c.toBlob(res, "image/png"));
      zip.file(`page-${p+1}.png`, blob);
    }
    const zipBlob = await zip.generateAsync({type:"blob"});
    downloadBlob(zipBlob, (state.topic || "lab-record").replace(/\s+/g,"_") + "-images.zip");
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

render();
