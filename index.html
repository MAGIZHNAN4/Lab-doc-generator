<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Record Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --paper:#FBFAF5;--ink:#20283A;--rule:#DAD4C2;--margin-red:#A8394A;
  --graphite:#5C6470;--pine:#2E6B58;--pine-dark:#204C3F;--sheet-w:680px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 32px;color:var(--ink);
  font-family:'Source Serif 4',Georgia,serif;min-height:100vh
}
.topbar{display:flex;align-items:baseline;gap:14px;padding:22px 32px 16px;border-bottom:2px solid var(--ink);background:var(--paper)}
.topbar .mark{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;background:var(--ink);color:var(--paper);padding:3px 8px}
.topbar h1{font-size:21px;font-weight:600;margin:0}.topbar .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--graphite)}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar-actions button{padding:6px 9px;font-size:10.5px}.save-status{font:10.5px 'IBM Plex Mono',monospace;color:var(--graphite);min-width:70px}
.layout{display:grid;grid-template-columns:minmax(320px,440px) 1fr;min-height:calc(100vh - 70px)}
@media(max-width:920px){.layout{grid-template-columns:1fr}}
.panel-form{border-right:2px solid var(--ink);padding:26px 30px 60px;position:relative}
.panel-preview{padding:26px 30px 60px;display:flex;flex-direction:column;align-items:center;gap:18px;overflow-x:auto}
.progress{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--graphite);display:flex;justify-content:space-between;margin-bottom:8px}
.progress-track{height:3px;background:var(--rule);margin-bottom:24px;position:relative}.progress-fill{position:absolute;left:0;top:0;height:100%;background:var(--pine);transition:width .25s}
.question-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-4px 0 20px;padding:9px 10px;border:1px solid var(--rule);background:#fff}
.question-controls span{font:11px 'IBM Plex Mono',monospace;color:var(--graphite)}.question-controls b{color:var(--ink)}
.question-controls button{padding:6px 9px;font-size:10.5px}
.field-label{font:10.5px 'IBM Plex Mono',monospace;letter-spacing:.03em;color:var(--margin-red);margin-bottom:6px;display:block}
.field-title{font-size:22px;font-weight:600;margin:0 0 6px}.field-help{font-size:13.5px;color:var(--graphite);margin:0 0 18px;line-height:1.5}
input[type=text],input[type=date],input[type=number],textarea{
 width:100%;font:14px 'IBM Plex Mono',monospace;padding:11px 12px;border:1.5px solid var(--ink);
 background:#fff;color:var(--ink);border-radius:2px
}
textarea{resize:vertical;min-height:100px;line-height:1.5}
input:focus,textarea:focus{outline:2px solid var(--pine);outline-offset:1px}
.nav-row{display:flex;gap:10px;margin-top:22px}
button{font:12px 'IBM Plex Mono',monospace;letter-spacing:.02em;padding:10px 16px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;border-radius:2px}
button.primary{background:var(--ink);color:var(--paper)}button.primary:hover{background:#000}
button.ghost{border-color:var(--rule);color:var(--graphite)}button:disabled{opacity:.4;cursor:not-allowed}
button.pine{background:var(--pine);color:#fff;border-color:var(--pine)}button.pine:hover{background:var(--pine-dark)}
.sample-link{position:absolute;top:26px;right:30px;font:11px 'IBM Plex Mono',monospace;color:var(--pine);background:none;border:none;text-decoration:underline;padding:0}
.format-note{font:10.5px 'IBM Plex Mono',monospace;color:var(--graphite);border-top:1px solid var(--rule);padding-top:12px;margin-top:18px;line-height:1.6}
.upload-row{margin-top:12px}.upload-row.drag-active{outline:2px solid var(--pine);outline-offset:4px}
.upload-btn{display:inline-block;font:12px 'IBM Plex Mono',monospace;font-weight:600;color:var(--pine);border:1.5px dashed var(--pine);padding:9px 14px;border-radius:2px;cursor:pointer;background:#F2F6EC}
.upload-hint{font:11.5px 'IBM Plex Mono',monospace;color:var(--graphite);margin:6px 0 0}
.thumb-wrap{margin-top:12px;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:#fff}
.thumb-wrap img{display:block;max-width:100%;max-height:260px;margin:0 auto}.thumb-meta{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font:11px 'IBM Plex Mono',monospace;color:var(--graphite);border-top:1px solid var(--rule)}
.thumb-meta button{padding:4px 8px;font-size:10.5px}
.thumb-tools{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px;border-top:1px solid var(--rule)}
.thumb-tools button{padding:4px 7px;font-size:10.5px}
.sheet{
 width:var(--sheet-w);background:#fff;
 border:2px solid #111;
 outline:1px solid #111;
 outline-offset:-8px;
 box-shadow:0 1px 3px rgba(0,0,0,.15),0 12px 30px rgba(0,0,0,.08);
 padding:42px 48px;
 font-family:'Tinos','Times New Roman',serif;font-size:13.5px;line-height:1.5;color:#111
}
.doc-table{width:100%;border-collapse:collapse;margin-bottom:14px}.doc-table td{border:1px solid #111;padding:6px 10px;font-weight:700;vertical-align:middle}
.doc-table .topic-cell{text-align:center;width:73%}.doc-table .meta-cell{width:27%}
.doc-aim{margin-bottom:16px}.doc-aim b,.doc-label,.doc-result b{font-weight:700;text-decoration:underline}
.doc-aim-content,.doc-body-text,.doc-code{white-space:pre-wrap}.doc-label{margin:14px 0 4px}.doc-output-img{max-width:100%;max-height:560px;object-fit:contain;object-position:left top;display:block;margin:4px 0 8px}
.doc-output-empty{color:#999;font-style:italic;font-size:12.5px;margin-bottom:8px}.doc-result{margin-top:20px}
.empty-hint{color:var(--graphite);font:12px 'IBM Plex Mono',monospace;max-width:32ch;text-align:center;margin-top:80px}
.modal-backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(32,40,58,.42)}
.modal{width:min(600px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border:2px solid var(--ink);background:var(--paper);box-shadow:0 18px 44px rgba(0,0,0,.3)}
.modal h2{margin:0 0 8px;font-size:20px}.modal p{color:var(--graphite);font-size:13px;line-height:1.45}
.question-manager-row{display:flex;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--rule);font:12px 'IBM Plex Mono',monospace}
.question-manager-row span{flex:1}.question-manager-row button{padding:5px 8px;font-size:10.5px}.modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
@media print{
 body{background:#fff}body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}
 #printRoot .sheet{width:auto;min-height:0;box-shadow:none;margin:0;outline:none}
 #printRoot .doc-aim,#printRoot .doc-result,#printRoot .question-print-block{break-inside:avoid;page-break-inside:avoid}
 @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="topbar">
  <span class="mark">LR</span>
  <div><h1>Lab Record Generator</h1><div class="sub">Word, picture, and print-to-PDF export · draft autosaves in this browser</div></div>
  <div class="topbar-actions">
    <span class="save-status" id="saveStatus">Not saved</span>
    <button class="ghost" id="btnLoadDraft">Load draft</button>
    <button class="ghost" id="btnClearDraft">Clear saved</button>
  </div>
</div>
<div class="layout">
  <div class="panel-form" id="panelForm"></div>
  <div class="panel-preview" id="panelPreview"></div>
</div>
<div id="printRoot" style="display:none"></div>

<script>
function blankQ(){return{question:"",code:"",outputText:"",outputImages:[]}}
const state={regNo:"",date:"",exNo:"",topic:"",aim:"",numQs:2,questions:[],result:""};
let step=0,autosaveTimer=null;
const KEY="lab-record-generator-enhanced-v2";

function imgs(q){return q.outputImages||[]}
function saveData(){
 return JSON.stringify({...state,step,questions:state.questions.map(q=>({
  question:q.question||"",code:q.code||"",outputText:q.outputText||"",
  outputImages:imgs(q).map(x=>({dataUrl:x.dataUrl,name:x.name,ext:x.ext,mime:x.mime,width:x.width,height:x.height,sizePercent:x.sizePercent??100,rotation:x.rotation||0}))
 }))});
}
function status(t){let x=document.getElementById("saveStatus");if(x)x.textContent=t}
function autosave(){clearTimeout(autosaveTimer);status("Saving…");autosaveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,saveData());status("Saved locally")}catch(e){status("Draft too large")}},350)}
function loadDraft(){
 let raw=localStorage.getItem(KEY);if(!raw){alert("No saved draft was found.");return}
 try{let x=JSON.parse(raw);Object.assign(state,{regNo:x.regNo||"",date:x.date||"",exNo:x.exNo||"",topic:x.topic||"",aim:x.aim||"",numQs:Math.max(1,Math.min(20,+x.numQs||1)),result:x.result||""});
 state.questions=Array.isArray(x.questions)?x.questions.map(q=>({question:q.question||"",code:q.code||"",outputText:q.outputText||"",outputImages:q.outputImages||[]})):[];step=Math.max(0,Math.min(+x.step||0,steps().length-1));render();status("Saved draft loaded")}catch(e){alert("Could not load saved draft.")}}
function clearDraft(){if(confirm("Clear the saved draft?")){localStorage.removeItem(KEY);status("Saved draft cleared")}}

function steps(){
 let a=[
  ["regNo","text","Register Number","Header — Reg No","Placed in the left header cell."],
  ["exNo","text","Exercise Number","Header — Ex. No","Printed as Ex. No beneath the register number."],
  ["date","date","Date","Header — Date","Use DD-MM-YYYY."],
  ["topic","text","Topic","Header — Topic","Centered in the wide right-hand cell."],
  ["aim","textarea","Aim","Body — Aim","One or two sentences."],
  ["numQs","number","Number of Questions","Questions — Count","Choose how many questions the record contains."]
 ];
 let n=Math.max(1,Math.min(20,+state.numQs||1));
 for(let i=0;i<n;i++){a.push(["q"+i+"_question","textarea","Q"+(i+1)+" — Question","Question "+(i+1),"The experiment question."]);a.push(["q"+i+"_code","code","Q"+(i+1)+" — Program","Question "+(i+1)+" — Code","Paste the complete source code."]);a.push(["q"+i+"_output","output","Q"+(i+1)+" — Output","Question "+(i+1)+" — Output","Upload an output screenshot."])}
 a.push(["result","textarea","Result","Closing — Result","Printed at the end of the record."]);
 return a
}
function getVal(k){
 if(k.startsWith("q")){let [q,f]=k.split("_"),i=+q.slice(1);return(state.questions[i]||blankQ())[f]||""}
 return state[k]??""
}
function setVal(k,v){
 if(k.startsWith("q")){let[q,f]=k.split("_"),i=+q.slice(1);if(!state.questions[i])state.questions[i]=blankQ();state.questions[i][f]=v}else state[k]=v;autosave()
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function dateDisplay(v){if(!v)return"";if(/^\d{4}-\d{2}-\d{2}$/.test(v)){let[d,m,y]=v.split("-");return d+"-"+m+"-"+y}return v}
function fieldHTML(s){
 let[k,type,title,label,help]=s,v=getVal(k);
 if(type==="date")return`<label class="field-label">${label}</label><h2 class="field-title">${title}</h2><p class="field-help">${help}</p><input id="field" type="date" value="${/^\d{4}-/.test(v)?v:""}">`;
 if(type==="number")return`<label class="field-label">${label}</label><h2 class="field-title">${title}</h2><p class="field-help">${help}</p>${questionControls()}<input id="field" type="number" min="1" max="20" value="${state.numQs}">`;
 if(type==="output")return`<label class="field-label">${label}</label><h2 class="field-title">${title}</h2><p class="field-help">${help}</p>${uploadHTML(+k.match(/^q(\\d+)/)[1])}`;
 if(type==="code")return`<label class="field-label">${label}</label><h2 class="field-title">${title}</h2><p class="field-help">${help}</p><textarea id="field" style="min-height:300px">${esc(v)}</textarea>`;
 return`<label class="field-label">${label}</label><h2 class="field-title">${title}</h2><p class="field-help">${help}</p><${type==="textarea"?"textarea":"input type=\"text\""} id="field">${esc(v)}</${type==="textarea"?"textarea":"input"}>`;
}
function questionControls(){
 let n=Math.max(1,Math.min(20,+state.numQs||1));
 return`<div class="question-controls"><span>Questions: <b>${n}</b></span><div><button type="button" id="manage">Manage</button> <button type="button" id="remove" ${n<=1?"disabled":""}>− Remove</button> <button type="button" id="add" ${n>=20?"disabled":""}>+ Add</button></div></div>`
}
function uploadHTML(i){
 let q=state.questions[i]||blankQ(),arr=imgs(q);
 return`<div class="upload-row" id="drop"><label class="upload-btn">Choose output image<input id="file" type="file" accept="image/*" multiple hidden></label><p class="upload-hint">PNG, JPG, WEBP. You can also drag images here.</p>
 ${arr.map((im,j)=>`<div class="thumb-wrap"><img src="${im.dataUrl}" style="transform:rotate(${im.rotation||0}deg);width:${im.sizePercent||100}%"><div class="thumb-meta"><span>${esc(im.name||"output")}</span><button data-del="${j}">Remove</button></div><div class="thumb-tools"><button data-rot="${j}" data-dir="-1">↶ Rotate</button><button data-rot="${j}" data-dir="1">Rotate ↷</button><button data-size="${j}" data-dir="-10">Smaller</button><button data-size="${j}" data-dir="10">Larger</button></div></div>`).join("")}</div>`
}
function bindField(){
 let s=steps()[step],el=document.getElementById("field");if(!el)return;
 el.addEventListener("input",()=>{if(s[0]==="date")setVal("date",el.value);else setVal(s[0],el.value);renderPreview()});
 if(s[0]==="numQs")el.addEventListener("change",()=>{let n=Math.max(1,Math.min(20,+el.value||1));state.numQs=n;while(state.questions.length<n)state.questions.push(blankQ());state.questions.length=n;step=Math.min(step,steps().length-1);autosave();render()});
 if(s[0]==="date")el.addEventListener("change",()=>{state.date=el.value;autosave();renderPreview()});
}
function bindUpload(){
 let s=steps()[step];if(s[2]!=="output")return;let i=+s[0].match(/^q(\\d+)/)[1],q=state.questions[i]||blankQ();
 document.getElementById("file")?.addEventListener("change",e=>readImages(i,[...e.target.files]));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{q.outputImages.splice(+b.dataset.del,1);autosave();render()});
 document.querySelectorAll("[data-rot]").forEach(b=>b.onclick=()=>{let x=q.outputImages[+b.dataset.rot];x.rotation=(x.rotation||0)+90*(+b.dataset.dir);autosave();render()});
 document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{let x=q.outputImages[+b.dataset.size];x.sizePercent=Math.max(20,Math.min(100,(x.sizePercent||100)+(+b.dataset.dir)));autosave();render()});
 let drop=document.getElementById("drop");["dragenter","dragover"].forEach(ev=>drop?.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag-active")}));["dragleave","drop"].forEach(ev=>drop?.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag-active")}));drop?.addEventListener("drop",e=>readImages(i,[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"))))
}
function readImages(i,files){
 if(!state.questions[i])state.questions[i]=blankQ();
 let pending=files.map(file=>new Promise(res=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>res({dataUrl:r.result,name:file.name,mime:file.type,width:im.naturalWidth,height:im.naturalHeight,sizePercent:100,rotation:0});im.src=r.result};r.readAsDataURL(file)}));
 Promise.all(pending).then(x=>{state.questions[i].outputImages.push(...x);autosave();render()})
}
function navButtons(){
 let last=step>=steps().length-1;
 return`<div class="nav-row"><button id="back" ${step===0?"disabled":""}>← Back</button>${last?`<button class="pine" id="review">Review Record</button>`:`<button class="primary" id="next">Next →</button>`}</div><div class="format-note">Tip: use the sample to see the intended format. Your draft is saved automatically in this browser.</div>`
}
function render(){
 let ss=steps();if(step>=ss.length)step=ss.length-1;let s=ss[step],pct=((step+1)/ss.length)*100;
 document.getElementById("panelForm").innerHTML=`<button class="sample-link" id="sample">Load sample</button><div class="progress"><span>Step ${step+1} of ${ss.length}</span><span>${Math.round(pct)}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>${fieldHTML(s)}${navButtons()}`;
 document.getElementById("sample").onclick=loadSample;bindField();bindUpload();
 document.getElementById("back").onclick=()=>{if(step>0){step--;render()}};
 document.getElementById("next")?.addEventListener("click",()=>{if(validateStep()){step++;render()}});
 document.getElementById("review")?.addEventListener("click",()=>{if(validateStep()){renderPreview();reviewMode()}});
 document.getElementById("add")?.addEventListener("click",()=>{state.numQs++;state.questions.push(blankQ());autosave();render()});
 document.getElementById("remove")?.addEventListener("click",()=>{if(state.numQs>1){state.questions.pop();state.numQs--;autosave();render()}});
 document.getElementById("manage")?.addEventListener("click",manager);
 renderPreview();
}
function validateStep(){
 let s=steps()[step],v=getVal(s[0]);
 if(s[0]==="numQs"){state.numQs=Math.max(1,Math.min(20,+v||1));while(state.questions.length<state.numQs)state.questions.push(blankQ());return true}
 if(s[2]==="output")return true;
 if(!String(v).trim()){alert("Please enter "+s[2].toLowerCase()+".");return false}
 return true
}
function previewHTML(){
 let h=`<div class="sheet"><table class="doc-table"><tr><td rowspan="3" class="meta-cell">Reg. No: ${esc(state.regNo)}<br><br>Ex. No: ${esc(state.exNo)}<br><br>Date: ${esc(dateDisplay(state.date))}</td><td class="topic-cell">TOPIC</td></tr><tr><td class="topic-cell">${esc(state.topic)}</td></tr><tr><td class="topic-cell">&nbsp;</td></tr></table>
 <div class="doc-aim"><b>AIM:</b><div class="doc-aim-content">${esc(state.aim)}</div></div>`;
 state.questions.slice(0,state.numQs).forEach((q,i)=>{
  h+=`<div class="question-print-block"><div class="doc-label">QUESTION:</div><div class="doc-body-text">${esc(q.question)}</div><div class="doc-label">PROGRAM:</div><div class="doc-code">${esc(q.code)}</div><div class="doc-label">OUTPUT:</div>`;
  let ar=imgs(q);if(ar.length)ar.forEach(im=>h+=`<img class="doc-output-img" src="${im.dataUrl}" style="width:${im.sizePercent||100}%;transform:rotate(${im.rotation||0}deg)">`);else h+=`<div class="doc-output-empty">[Output screenshot will appear here]</div>`;
  h+=`</div>`});
 h+=`<div class="doc-result"><b>RESULT:</b><div class="doc-body-text">${esc(state.result)}</div></div></div>`;return h
}
function renderPreview(){
 let p=document.getElementById("panelPreview");
 if(!p)return;
 p.innerHTML=previewHTML()+`<div class="review-actions"><button class="pine" id="downloadWord">Download Word</button><button class="primary" id="print">Print / PDF</button><button id="savePng">Save Preview PNG</button></div>`;
 document.getElementById("downloadWord").onclick=downloadWord;
 document.getElementById("print").onclick=printRecord;
 document.getElementById("savePng").onclick=savePNG
}
function reviewMode(){document.getElementById("panelPreview").scrollIntoView({behavior:"smooth"})}
function printRecord(){
 let r=document.getElementById("printRoot");r.innerHTML=previewHTML();r.style.display="block";setTimeout(()=>{window.print();setTimeout(()=>{r.style.display="none"},500)},100)
}
async function savePNG(){
 if(!window.html2canvas){alert("PNG library is unavailable.");return}
 let sheet=document.querySelector(".panel-preview .sheet");let canvas=await html2canvas(sheet,{scale:2,backgroundColor:"#fff"});let a=document.createElement("a");a.download="lab-record-preview.png";a.href=canvas.toDataURL("image/png");a.click()
}
function downloadWord(){
 let body=previewHTML().replace('<div class="sheet">','<div class="sheet" style="width:auto;outline:none;box-shadow:none">');
 let html=`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:"Times New Roman",serif;color:#111}.sheet{border:2px solid #111;outline:1px solid #111;outline-offset:-8px;padding:42px 48px}.doc-table{width:100%;border-collapse:collapse}.doc-table td{border:1px solid #111;padding:6px 10px;font-weight:bold}.doc-label,.doc-result b,.doc-aim b{font-weight:bold;text-decoration:underline}.doc-code{white-space:pre-wrap}.doc-body-text{white-space:pre-wrap}.doc-output-img{max-width:100%;max-height:560px;display:block}</style></head><body>${body}</body></html>`;
 let blob=new Blob([html],{type:"application/msword"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Lab_Record.doc";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function manager(){
 let n=state.numQs,rows=Array.from({length:n},(_,i)=>`<div class="question-manager-row"><span>Question ${i+1}</span><button data-up="${i}" ${i===0?"disabled":""}>↑</button><button data-down="${i}" ${i===n-1?"disabled":""}>↓</button><button data-delq="${i}" ${n===1?"disabled":""}>Delete</button></div>`).join("");
 let b=document.createElement("div");b.className="modal-backdrop";b.innerHTML=`<div class="modal"><h2>Manage questions</h2><p>Reorder or delete questions.</p>${rows}<div class="modal-actions"><button id="done">Done</button></div></div>`;document.body.appendChild(b);
 b.querySelector("#done").onclick=()=>{b.remove();render()};b.querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>{let i=+x.dataset.up;[state.questions[i],state.questions[i-1]]=[state.questions[i-1],state.questions[i]];autosave();b.remove();manager()});b.querySelectorAll("[data-down]").forEach(x=>x.onclick=()=>{let i=+x.dataset.down;[state.questions[i],state.questions[i+1]]=[state.questions[i+1],state.questions[i]];autosave();b.remove();manager()});b.querySelectorAll("[data-delq]").forEach(x=>x.onclick=()=>{let i=+x.dataset.delq;if(confirm("Delete this question?")){state.questions.splice(i,1);state.numQs--;autosave();b.remove();manager()}})
}
